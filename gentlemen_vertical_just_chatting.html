<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>The Gentlemen – Just Chatting (Vertical 9:16)</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IM+Fell+English:ital@0;1&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background: transparent;
            font-family: 'Playfair Display', serif;
            position: relative;
            pointer-events: none;
        }

        /* =========================================================
           1. ULTRA-SLIM GENTLEMEN RIBBON OUTER FRAME (9:16 FULLSCREEN CAM)
           ========================================================= */
        .outer-ribbon-frame {
            position: absolute;
            inset: 0;
            border: 6px solid #0d1a0f;
            box-shadow:
                inset 0 0 0 2px #e5c96a,
                inset 0 0 0 6px #0d1a0f,
                inset 0 0 0 7.5px rgba(200, 168, 75, 0.6),
                inset 0 0 45px rgba(0, 0, 0, 0.55);
            z-index: 20;
        }

        /* Innere feine Zierlinie mit Abstand */
        .inner-hairline {
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(229, 201, 106, 0.28);
            z-index: 19;
        }

        /* 4 Goldene Eck-Ornamente */
        .corner {
            position: absolute;
            width: 58px;
            height: 58px;
            z-index: 25;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.85));
        }
        .corner svg { width: 100%; height: 100%; }
        .corner-tl { top: 14px; left: 14px; }
        .corner-tr { top: 14px; right: 14px; transform: scaleX(-1); }
        .corner-bl { bottom: 14px; left: 14px; transform: scaleY(-1); }
        .corner-br { bottom: 14px; right: 14px; transform: scale(-1,-1); }

        /* =========================================================
           2. DEZENTE SALON-KOPFPLAKETTE
           ========================================================= */
        .top-salon-badge {
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(160deg, #0d180e 0%, #162818 50%, #0b140c 100%);
            border: 1.5px solid #e5c96a;
            border-top: none;
            border-radius: 0 0 14px 14px;
            padding: 8px 32px 9px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.88), inset 0 -1px 0 rgba(229, 201, 106, 0.25);
            z-index: 30;
        }

        .badge-gem {
            color: #e5c96a;
            font-size: 11px;
        }

        .badge-brand {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 15px;
            letter-spacing: 3px;
            color: #f3ebd6;
            text-transform: uppercase;
        }

        .badge-sub {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 2.5px;
            color: #c8a84b;
            text-transform: uppercase;
            border-left: 1px solid rgba(200, 168, 75, 0.4);
            padding-left: 12px;
        }

        /* =========================================================
           3. OPTIONALER TRANSPARENTER LIVE-CHAT IM UNTEREN BEREICH (?chat=1)
           Standardmäßig ausgeblendet, damit die native Twitch-Mobile-UI frei bleibt.
           Aktivierung jederzeit über ?chat=1 an der URL!
           ========================================================= */
        .transparent-chat-zone {
            position: absolute;
            bottom: 390px; /* Exakt oberhalb der Twitch Mobile Bottom-Bar */
            left: 42px;
            width: 860px; /* Rechts 178px frei für Twitch Mobile Like/Share/Clip Icons */
            height: 440px;
            display: none;
            flex-direction: column;
            justify-content: flex-end;
            gap: 10px;
            overflow: hidden;
            z-index: 25;
            mask-image: linear-gradient(0deg, black 75%, transparent 100%);
            -webkit-mask-image: linear-gradient(0deg, black 75%, transparent 100%);
        }

        body.show-chat .transparent-chat-zone {
            display: flex;
        }

        .jc-chat-msg {
            background: linear-gradient(135deg, rgba(12, 22, 13, 0.78) 0%, rgba(20, 34, 21, 0.78) 100%);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(200, 168, 75, 0.35);
            border-left: 3.5px solid #e5c96a;
            border-radius: 0 6px 6px 0;
            padding: 10px 18px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.65);
            animation: chatSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            max-width: 100%;
        }

        @keyframes chatSlideUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .jc-chat-msg.fade-out {
            transition: opacity 0.6s ease;
            opacity: 0;
        }

        .jc-chat-user {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 16px;
            color: #e5c96a;
            margin-right: 8px;
        }

        .jc-chat-text {
            font-family: 'IM Fell English', serif;
            font-size: 21px;
            color: #f3ebd6;
            line-height: 1.35;
            word-break: break-word;
        }
    </style>
</head>
<body data-scene="just_chatting">

    <div class="outer-ribbon-frame"></div>
    <div class="inner-hairline"></div>

    <!-- 4 Ecken -->
    <div class="corner corner-tl">
        <svg viewBox="0 0 60 60" fill="none">
            <path d="M3 55 L3 3 L55 3" stroke="#e5c96a" stroke-width="3"/>
            <path d="M3 3 L15 15" stroke="rgba(229,201,106,0.55)" stroke-width="1.5"/>
            <circle cx="3" cy="3" r="3.5" fill="#e5c96a"/>
        </svg>
    </div>
    <div class="corner corner-tr">
        <svg viewBox="0 0 60 60" fill="none">
            <path d="M3 55 L3 3 L55 3" stroke="#e5c96a" stroke-width="3"/>
            <path d="M3 3 L15 15" stroke="rgba(229,201,106,0.55)" stroke-width="1.5"/>
            <circle cx="3" cy="3" r="3.5" fill="#e5c96a"/>
        </svg>
    </div>
    <div class="corner corner-bl">
        <svg viewBox="0 0 60 60" fill="none">
            <path d="M3 55 L3 3 L55 3" stroke="#e5c96a" stroke-width="3"/>
            <path d="M3 3 L15 15" stroke="rgba(229,201,106,0.55)" stroke-width="1.5"/>
            <circle cx="3" cy="3" r="3.5" fill="#e5c96a"/>
        </svg>
    </div>
    <div class="corner corner-br">
        <svg viewBox="0 0 60 60" fill="none">
            <path d="M3 55 L3 3 L55 3" stroke="#e5c96a" stroke-width="3"/>
            <path d="M3 3 L15 15" stroke="rgba(229,201,106,0.55)" stroke-width="1.5"/>
            <circle cx="3" cy="3" r="3.5" fill="#e5c96a"/>
        </svg>
    </div>

    <!-- Obere Salon-Plakette -->
    <div class="top-salon-badge" id="topBadge">
        <span class="badge-gem">✦</span>
        <span class="badge-brand">Doppel XP</span>
        <span class="badge-sub">The Gentlemen Salon</span>
        <span class="badge-gem">✦</span>
    </div>

    <!-- Optionaler transparenter Live-Chat (?chat=1) -->
    <div class="transparent-chat-zone" id="chatZone"></div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const channel = (params.get('channel') || 'd0ppelxp').toLowerCase();
        const showChat = params.get('chat') === '1';

        if (params.get('badge') === '0') {
            document.getElementById('topBadge').style.display = 'none';
        }

        if (showChat) {
            document.body.classList.add('show-chat');
            connectJustChattingIrc(channel);
        }

        function esc(s) {
            return String(s || '')
                .replace(/&/g,'&amp;').replace(/</g,'&lt;')
                .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function addChatBubble(user, text) {
            const zone = document.getElementById('chatZone');
            while (zone.children.length >= 6) {
                zone.removeChild(zone.firstChild);
            }
            const el = document.createElement('div');
            el.className = 'jc-chat-msg';
            el.innerHTML = `<span class="jc-chat-user">${esc(user)}:</span><span class="jc-chat-text">${esc(text)}</span>`;
            zone.appendChild(el);

            setTimeout(() => {
                el.classList.add('fade-out');
                setTimeout(() => el.parentNode && el.parentNode.removeChild(el), 650);
            }, 35000);
        }

        function connectJustChattingIrc(chan) {
            const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
            ws.onopen = () => {
                ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
                ws.send('PASS SCHMOOPIIE');
                ws.send('NICK justinfan' + Math.floor(Math.random() * 89999 + 10000));
                ws.send('JOIN #' + chan);
            };
            ws.onmessage = (e) => {
                const lines = e.data.split('\r\n');
                for (const line of lines) {
                    if (!line) continue;
                    if (line.startsWith('PING')) {
                        ws.send('PONG :tmi.twitch.tv');
                        continue;
                    }
                    if (line.includes('PRIVMSG')) {
                        const nameMatch = line.match(/display-name=([^;]+)/);
                        const user = nameMatch ? nameMatch[1] : 'Gast';
                        const msgMatch = line.match(/PRIVMSG #[^ ]+ :(.*)$/);
                        if (!msgMatch) continue;
                        const text = msgMatch[1].trim();
                        if (text.startsWith('!')) continue;
                        addChatBubble(user, text);
                    }
                }
            };
            ws.onclose = () => setTimeout(() => connectJustChattingIrc(chan), 5000);
        }
    </script>
    <script src="gentlemen_vertical_alerts.js"></script>
</body>
</html>
