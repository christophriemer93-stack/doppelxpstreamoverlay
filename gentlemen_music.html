<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Gentlemen - Music Widget</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: transparent;
            overflow: hidden;
            font-family: 'Playfair Display', serif;
            color: #fff;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            height: 100vh;
            padding: 0 0 28px 28px;
        }

        .widget-container {
            position: relative;
            width: 460px;
            height: 180px;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            overflow: visible;
        }

        #particle-canvas {
            position: absolute;
            left: -30px;
            bottom: -20px;
            width: 520px;
            height: 220px;
            pointer-events: none;
            z-index: 1;
            opacity: 0;
            transition: opacity 1.2s ease;
        }

        #particle-canvas.show {
            opacity: 1;
        }

        .music-card {
            display: flex;
            align-items: center;
            width: 400px;
            background: linear-gradient(135deg, rgba(25, 38, 22, 0.94) 0%, rgba(35, 50, 28, 0.94) 100%);
            border: 1px solid rgba(180, 140, 60, 0.4);
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.4),
                0 6px 30px rgba(0,0,0,0.7),
                inset 0 1px 0 rgba(200,168,75,0.15);
            position: relative;
            z-index: 2;
            transform: translateY(140%) scale(0.97);
            opacity: 0;
            transition: 
                transform 1.3s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 1.1s cubic-bezier(0.2, 0, 0, 1);
            overflow: hidden;
            will-change: transform, opacity;
        }

        .music-card.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* Gold left accent border */
        .music-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, transparent, #c8a84b 20%, #d4a843 50%, #c8a84b 80%, transparent);
        }

        /* Top shimmer line */
        .music-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200,168,75,0.6) 30%, rgba(200,168,75,0.9) 50%, rgba(200,168,75,0.6) 70%, transparent);
        }

        .cover-wrapper {
            position: relative;
            width: 72px; height: 72px;
            flex-shrink: 0;
            margin: 14px 15px 14px 18px;
            border: 1px solid rgba(180,140,60,0.4);
            background: #0a100a;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .cover-art {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: sepia(0.3) contrast(1.05) brightness(0.85);
        }

        /* Vignette on cover */
        .cover-wrapper::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            box-shadow: inset 0 0 12px rgba(0,0,0,0.6);
            pointer-events: none;
        }

        .info {
            flex: 1;
            overflow: hidden;
            padding-right: 14px;
        }

        .label {
            font-family: 'IM Fell English', serif;
            font-style: italic;
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(200, 168, 75, 0.6);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .song-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 17px;
            color: #e8dcc0;
            white-space: nowrap;
            overflow: hidden;
            line-height: 1.2;
            margin-bottom: 3px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .marquee-wrapper {
            overflow: hidden;
        }

        .marquee-inner {
            display: inline-block;
            animation: marquee 9s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .song-artist {
            font-family: 'IM Fell English', serif;
            font-style: italic;
            font-size: 13px;
            color: rgba(200, 168, 75, 0.8);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .divider-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 5px 0 4px;
        }
        .divider-row .line {
            flex: 1;
            height: 1px;
            background: rgba(200,168,75,0.2);
        }
        .divider-row .dot {
            font-size: 8px;
            color: rgba(200,168,75,0.5);
        }
    </style>
</head>
<body>
    <div class="widget-container">
        <canvas id="particle-canvas" width="520" height="220"></canvas>
        <div class="music-card" id="music-card">
            <div class="cover-wrapper">
                <img id="cover" class="cover-art" src="">
            </div>
            <div class="info">
                <div class="label">♪ Now Playing</div>
                <div class="divider-row">
                    <div class="line"></div><div class="dot">✦</div><div class="line"></div>
                </div>
                <div class="song-title">
                    <div class="marquee-wrapper">
                        <span id="title-inner">...</span>
                    </div>
                </div>
                <div class="song-artist" id="artist">...</div>
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('music-card');
        const particleCanvas = document.getElementById('particle-canvas');
        const pCtx = particleCanvas.getContext('2d');
        const titleEl = document.getElementById('title-inner');
        const artistEl = document.getElementById('artist');
        const coverEl = document.getElementById('cover');

        const DEFAULT_TOKEN = "2edba609c4603d423344380fd1df8caf40f3a4af44338e2bdf938b1e8379a661d217e8ea9578c593a9b06e4268e3d4e02bb938be1f92a176ae84cf7184eb36d5d0d79957d565e0c845751322991e60f9b33c39c4cafd89d51502ae833eeea2ee3fbcc2d671873d584a1e61030473919eb3d3da0825bff8883c06063e5ef0388a36a583ab409355c2ab7f32df2bbecb296960146706db0a3de5c597e874107e8e517ae9193822e29983b14ffe5eb3d7db80ec97c12ecd00376c165451c2e94fb0610137d15bd4203a3e8201c36fce5ec72a6f4267c1ead874b8436357a4046d552891014bad14934f8c488b8de784625ee3636af98eb11eb88a1b8633828fc5c1";

        let currentSongTitle = "";
        let hideTimer = null;
        const DISPLAY_DURATION_MS = 10000; // Exakt 10 Sekunden Anzeigezeit

        // --- GOLDENE SCHWEBENDE PARTIKEL (THE GENTLEMEN STIL) ---
        const P_COUNT = 36;
        const particles = Array.from({ length: P_COUNT }, () => ({
            x: Math.random() * 520,
            y: Math.random() * 220,
            r: Math.random() * 1.8 + 0.4,
            speed: Math.random() * 0.35 + 0.1,
            drift: (Math.random() - 0.5) * 0.22,
            phase: Math.random() * Math.PI * 2,
            isBright: Math.random() > 0.4
        }));

        function drawWidgetParticles() {
            pCtx.clearRect(0, 0, 520, 220);
            const now = Date.now() * 0.001;

            particles.forEach(p => {
                const alpha = 0.15 + Math.abs(Math.sin(now * 0.8 + p.phase)) * 0.5;
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                pCtx.fillStyle = p.isBright 
                    ? `rgba(229, 201, 106, ${alpha.toFixed(2)})` 
                    : `rgba(200, 168, 75, ${alpha.toFixed(2)})`;
                pCtx.shadowBlur = p.r * 3;
                pCtx.shadowColor = 'rgba(229, 201, 106, 0.5)';
                pCtx.fill();

                p.y -= p.speed;
                p.x += p.drift + Math.sin(now * 0.5 + p.phase) * 0.15;

                // Reset nach oben
                if (p.y < 0) {
                    p.y = 220;
                    p.x = Math.random() * 520;
                }
                if (p.x < 0) p.x = 520;
                if (p.x > 520) p.x = 0;
            });

            requestAnimationFrame(drawWidgetParticles);
        }
        drawWidgetParticles();

        function esc(s) {
            return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function showTrack(song) {
            if (!song || !song.title) return;

            // Neuer Song?
            if (song.title !== currentSongTitle) {
                currentSongTitle = song.title;

                coverEl.src = song.cover || "https://images.unsplash.com/photo-1539185441755-769473a23570?w=150&q=80";
                artistEl.innerText = song.artist || "The Gentlemen";

                if (song.title.length > 22) {
                    titleEl.parentElement.classList.add('marquee-wrapper');
                    titleEl.innerHTML = `<span class="marquee-inner">${esc(song.title)} &nbsp;&nbsp;&mdash;&nbsp;&nbsp; ${esc(song.title)}</span>`;
                } else {
                    titleEl.parentElement.classList.remove('marquee-wrapper');
                    titleEl.innerHTML = esc(song.title);
                }

                // Einblenden von Karte und goldenem Partikelfeld
                card.classList.add('show');
                particleCanvas.classList.add('show');

                // Timer für exakt 10 Sekunden starten
                if (hideTimer) clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                    card.classList.remove('show');
                    particleCanvas.classList.remove('show');
                }, DISPLAY_DURATION_MS);
            }
        }

        function handleStateUpdate(data) {
            if (!data) return;

            // YTMDesktop v2 format
            if (data.video && data.video.title) {
                const vid = data.video;
                const isPlaying = (data.player && data.player.trackState === 1);
                
                if (isPlaying) {
                    let coverUrl = "";
                    if (vid.thumbnails && vid.thumbnails.length > 0) {
                        coverUrl = vid.thumbnails[vid.thumbnails.length - 1].url;
                    }
                    showTrack({
                        title: vid.title,
                        artist: vid.author,
                        cover: coverUrl
                    });
                } else {
                    // Falls pausiert und User schaltet ab
                    if (data.player && data.player.trackState === 2) {
                        // Song pausiert -> sofort oder nach Timer ausblenden
                        card.classList.remove('show');
                        if (hideTimer) clearTimeout(hideTimer);
                    }
                }
            }
        }

        // 1. ECHTE ECHTZEIT-VERBINDUNG VIA WEBSOCKET (Kein Polling, kein Rate-Limit!)
        function initWebSocket() {
            try {
                if (typeof io !== 'undefined') {
                    const socket = io("http://127.0.0.1:9863/api/v1/realtime", {
                        transports: ["websocket"],
                        auth: { token: DEFAULT_TOKEN }
                    });

                    socket.on("connect", () => {
                        console.log("[Gentlemen Music] Realtime WebSocket verbunden!");
                    });

                    socket.on("state-update", (state) => {
                        handleStateUpdate(state);
                    });

                    socket.on("connect_error", (err) => {
                        console.warn("[Gentlemen Music] WS Fallback aktiv:", err);
                    });
                }
            } catch (e) {
                console.warn("[Gentlemen Music] WS Fehler:", e);
            }
        }

        // 2. INITIALER HTTP FETCH (Einmalig beim Laden oder alle 5 Sekunden als Fallback)
        async function fetchInitialState() {
            try {
                const resp = await fetch('http://127.0.0.1:9863/api/v1/state', {
                    headers: { 'Authorization': DEFAULT_TOKEN }
                });
                if (resp.ok) {
                    const data = await resp.json();
                    handleStateUpdate(data);
                }
            } catch (e) {}
        }

        initWebSocket();
        fetchInitialState();
        setInterval(fetchInitialState, 5000); // Entspanntes Fallback-Polling alle 5s
    </script>
</body>
</html>
