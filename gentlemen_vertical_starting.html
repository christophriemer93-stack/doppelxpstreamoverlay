<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>The Gentlemen – Starting Soon (Vertical 9:16)</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=IM+Fell+English:ital@0;1&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background: #0d160d;
            font-family: 'Playfair Display', serif;
            position: relative;
        }

        /* === ANIMATED MANOR BACKGROUND === */
        #bg-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 1080px; height: 1920px;
            z-index: 0;
        }

        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 50% 42%, transparent 25%, rgba(0,0,0,0.82) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* === OUTER LUXURY FRAME === */
        .outer-frame {
            position: absolute;
            inset: 18px;
            border: 1px solid rgba(200, 168, 75, 0.32);
            box-shadow: inset 0 0 0 4px rgba(13, 22, 13, 0.85), inset 0 0 0 5px rgba(200, 168, 75, 0.16);
            z-index: 15;
            pointer-events: none;
        }

        .frame-top, .frame-bottom {
            position: absolute;
            left: 0; right: 0;
            height: 4px;
            z-index: 20;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(200,168,75,0.4) 12%,
                #c8a84b 32%,
                #e5c96a 50%,
                #c8a84b 68%,
                rgba(200,168,75,0.4) 88%,
                transparent 100%
            );
        }
        .frame-top { top: 0; }
        .frame-bottom { bottom: 0; }

        /* === CORNER ORNAMENTS === */
        .corner { position: absolute; width: 72px; height: 72px; z-index: 21; pointer-events: none; }
        .corner svg { width: 100%; height: 100%; }
        .corner-tl { top: 18px; left: 18px; }
        .corner-tr { top: 18px; right: 18px; transform: scaleX(-1); }
        .corner-bl { bottom: 18px; left: 18px; transform: scaleY(-1); }
        .corner-br { bottom: 18px; right: 18px; transform: scale(-1,-1); }

        /* === VERTICAL MAIN CONTAINER (RESPECTS TWITCH MOBILE SAFE ZONES) === */
        .vertical-layout {
            position: absolute;
            top: 0; left: 0;
            width: 1080px;
            height: 1920px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Oben 190px Abstand für Mobile-Header, unten 390px für Mobile-Chat/UI */
            padding: 195px 85px 395px 85px;
            justify-content: space-between;
            text-align: center;
        }

        /* --- TOP CREST & ESTATE TAG --- */
        .header-crest {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .monogram-badge {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: radial-gradient(circle, #182a19 0%, #0b140c 100%);
            border: 2px solid #c8a84b;
            box-shadow: 0 0 0 4px rgba(13, 22, 13, 0.95), 0 0 0 5px rgba(200, 168, 75, 0.35), 0 10px 30px rgba(0,0,0,0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 24px;
            color: #e5c96a;
            letter-spacing: 2px;
        }

        .estate-tag {
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(200, 168, 75, 0.75);
        }
        .estate-tag::before, .estate-tag::after {
            content: '';
            width: 55px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(200,168,75,0.6), transparent);
        }

        /* --- CENTER HERO BLOCK --- */
        .center-hero {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title {
            font-weight: 900;
            font-size: 112px;
            line-height: 0.98;
            color: #e8dcc0;
            letter-spacing: 1px;
            text-shadow: 0 6px 45px rgba(0,0,0,0.95), 0 0 80px rgba(200,168,75,0.12);
            margin-bottom: 24px;
        }

        .main-subtitle {
            font-family: 'IM Fell English', serif;
            font-style: italic;
            font-size: 28px;
            color: rgba(200,168,75,0.78);
            margin-bottom: 52px;
            letter-spacing: 0.5px;
        }

        /* --- STATUS CARD --- */
        .status-card {
            width: 100%;
            max-width: 860px;
            background: linear-gradient(135deg, rgba(18, 32, 18, 0.88) 0%, rgba(28, 46, 22, 0.88) 100%);
            border: 1px solid rgba(200, 168, 75, 0.35);
            border-top: 3px solid #c8a84b;
            border-bottom: 3px solid #c8a84b;
            padding: 26px 36px;
            margin-bottom: 52px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.75), inset 0 1px 0 rgba(229,201,106,0.2);
            position: relative;
        }

        .status-eyebrow {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(200,168,75,0.65);
            margin-bottom: 10px;
        }

        .status-text {
            font-family: 'IM Fell English', serif;
            font-style: italic;
            font-size: 28px;
            color: #f3ebd6;
            transition: opacity 0.6s ease;
            min-height: 38px;
        }
        .status-text.fading { opacity: 0; }

        /* --- TIMER BLOCK --- */
        .timer-block {
            width: 100%;
            max-width: 860px;
            background: rgba(10, 17, 10, 0.72);
            border: 1px solid rgba(200, 168, 75, 0.28);
            padding: 32px 44px 36px;
            border-radius: 4px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.7);
        }

        .timer-eyebrow {
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: rgba(200,168,75,0.6);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }
        .timer-eyebrow::before, .timer-eyebrow::after {
            content: '';
            width: 60px;
            height: 1px;
            background: rgba(200,168,75,0.25);
        }

        .timer-display {
            font-weight: 900;
            font-size: 104px;
            color: #e5c96a;
            letter-spacing: 8px;
            text-shadow: 0 0 45px rgba(200,168,75,0.4);
            line-height: 1;
            margin-bottom: 22px;
        }

        .timer-track {
            height: 6px;
            background: rgba(0,0,0,0.65);
            border: 1px solid rgba(180,140,60,0.3);
            position: relative;
            overflow: hidden;
            border-radius: 3px;
        }

        .timer-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, rgba(150,110,40,0.6), #c8a84b 60%, #f3ebd6);
            box-shadow: 0 0 14px rgba(200,168,75,0.65);
            transition: width 1s linear;
        }

        /* --- FOOTER MOTTO (ABOVE MOBILE SAFE ZONE) --- */
        .motto {
            font-family: 'IM Fell English', serif;
            font-style: italic;
            font-size: 20px;
            color: rgba(200,168,75,0.45);
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .motto::before, .motto::after {
            content: '';
            width: 55px;
            height: 1px;
            background: rgba(200,168,75,0.25);
        }
    </style>
</head>
<body data-scene="starting">

    <div class="frame-top"></div>
    <div class="frame-bottom"></div>
    <div class="outer-frame"></div>

    <!-- Corner ornaments -->
    <div class="corner corner-tl">
        <svg viewBox="0 0 70 70" fill="none">
            <path d="M4 66 L4 4 L66 4" stroke="#c8a84b" stroke-width="2.5"/>
            <path d="M4 4 L16 16" stroke="rgba(200,168,75,0.5)" stroke-width="1.2"/>
            <circle cx="4" cy="4" r="3.5" fill="#e5c96a"/>
        </svg>
    </div>
    <div class="corner corner-tr">
        <svg viewBox="0 0 70 70" fill="none">
            <path d="M4 66 L4 4 L66 4" stroke="#c8a84b" stroke-width="2.5"/>
            <path d="M4 4 L16 16" stroke="rgba(200,168,75,0.5)" stroke-width="1.2"/>
            <circle cx="4" cy="4" r="3.5" fill="#e5c96a"/>
        </svg>
    </div>
    <div class="corner corner-bl">
        <svg viewBox="0 0 70 70" fill="none">
            <path d="M4 66 L4 4 L66 4" stroke="#c8a84b" stroke-width="2.5"/>
            <path d="M4 4 L16 16" stroke="rgba(200,168,75,0.5)" stroke-width="1.2"/>
            <circle cx="4" cy="4" r="3.5" fill="#e5c96a"/>
        </svg>
    </div>
    <div class="corner corner-br">
        <svg viewBox="0 0 70 70" fill="none">
            <path d="M4 66 L4 4 L66 4" stroke="#c8a84b" stroke-width="2.5"/>
            <path d="M4 4 L16 16" stroke="rgba(200,168,75,0.5)" stroke-width="1.2"/>
            <circle cx="4" cy="4" r="3.5" fill="#e5c96a"/>
        </svg>
    </div>

    <canvas id="bg-canvas"></canvas>
    <div class="vignette"></div>

    <div class="vertical-layout">
        <div class="header-crest">
            <div class="monogram-badge">DXP</div>
            <div class="estate-tag">Halstead Estate präsentiert</div>
        </div>

        <div class="center-hero">
            <div class="main-title">Stream<br>startet<br>gleich.</div>
            <div class="main-subtitle">Nehmen Sie Platz. Die Herren erscheinen in Kürze.</div>

            <div class="status-card">
                <div class="status-eyebrow">✦ &nbsp; Aktueller Status im Salon &nbsp; ✦</div>
                <div class="status-text" id="status-text">Der Herr bereitet sich vor...</div>
            </div>

            <div class="timer-block">
                <div class="timer-eyebrow">Ankunft im Salon in</div>
                <div class="timer-display" id="timer-display">10:00</div>
                <div class="timer-track">
                    <div class="timer-fill" id="timer-fill"></div>
                </div>
            </div>
        </div>

        <div class="motto">Guter Geschmack kennt keine Kompromisse</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const COUNTDOWN_MINUTES = parseFloat(urlParams.get('min')) || 10;

        // --- Hintergrund-Partikel (1080 x 1920) ---
        const canvas = document.getElementById('bg-canvas');
        canvas.width = 1080;
        canvas.height = 1920;
        const ctx = canvas.getContext('2d');

        const bgGrad = ctx.createRadialGradient(540, 820, 80, 540, 820, 1100);
        bgGrad.addColorStop(0, '#1e2e1a');
        bgGrad.addColorStop(0.5, '#131d11');
        bgGrad.addColorStop(1, '#091009');

        const particles = Array.from({ length: 85 }, () => ({
            x: Math.random() * 1080,
            y: Math.random() * 1920,
            r: Math.random() * 2.1 + 0.3,
            speed: Math.random() * 0.28 + 0.05,
            drift: (Math.random() - 0.5) * 0.16,
            phase: Math.random() * Math.PI * 2,
        }));

        function drawBg() {
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, 1080, 1920);

            const now = Date.now() * 0.001;
            particles.forEach(p => {
                const alpha = 0.08 + Math.abs(Math.sin(now * 0.6 + p.phase)) * 0.28;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(200,168,75,${alpha.toFixed(2)})`;
                ctx.fill();

                p.y -= p.speed;
                p.x += p.drift;
                if (p.y < -4) { p.y = 1924; p.x = Math.random() * 1080; }
                if (p.x < 0) p.x = 1080;
                if (p.x > 1080) p.x = 0;
            });
            requestAnimationFrame(drawBg);
        }
        drawBg();

        // --- Countdown & Status ---
        let totalSeconds = Math.round(COUNTDOWN_MINUTES * 60);
        const startSeconds = totalSeconds;

        const statusStages = [
            { from: 1.0,  text: 'Die Herren bereiten sich im Ankleidezimmer vor...' },
            { from: 0.75, text: 'Der Maßanzug wird mit Sorgfalt angelegt...' },
            { from: 0.50, text: 'Die Kristallgläser an der Bar werden poliert...' },
            { from: 0.25, text: 'Der Wagen fährt am Anwesen vor...' },
            { from: 0.05, text: 'Ankunft ist unmittelbar bevorstehend.' },
            { from: 0,    text: 'Die Herren betreten den Salon.' },
        ];

        function getCurrentStatus(seconds) {
            const ratio = seconds / startSeconds;
            for (let i = statusStages.length - 1; i >= 0; i--) {
                if (ratio <= statusStages[i].from) return statusStages[i].text;
            }
            return statusStages[0].text;
        }

        let lastStatusText = '';
        const statusEl = document.getElementById('status-text');
        const timerEl  = document.getElementById('timer-display');
        const fillEl   = document.getElementById('timer-fill');

        function tick() {
            const m = Math.floor(totalSeconds / 60);
            const s = totalSeconds % 60;
            timerEl.innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            fillEl.style.width = Math.max(0, (totalSeconds / startSeconds) * 100) + '%';

            const newStatus = getCurrentStatus(totalSeconds);
            if (newStatus !== lastStatusText) {
                statusEl.classList.add('fading');
                setTimeout(() => {
                    statusEl.innerText = newStatus;
                    statusEl.classList.remove('fading');
                    lastStatusText = newStatus;
                }, 500);
            }

            if (totalSeconds > 0) totalSeconds--;
        }

        tick();
        setInterval(tick, 1000);
    </script>
    <script src="gentlemen_vertical_alerts.js?v=2"></script>
</body>
</html>
